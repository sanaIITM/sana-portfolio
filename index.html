footer{border-top:1px solid var(--line);background:#0d0912}.foot{min-height:86px;display:flex;align-items:center;justify-content:space-between;gap:20px}.footmark{width:30px;height:30px;font-size:20px}.foot p{color:#827687;font-size:10px;margin-right:auto;margin-left:10px}.footlinks{display:flex;align-items:center;gap:20px}.footlinks button,.footlinks a{font-size:10px}.footyear{color:#685c70;font:9px var(--mono)}
.personalhero{padding-top:115px;padding-bottom:95px;position:relative}.personalhero h1{font-size:clamp(60px,7vw,88px)}.personalhero>p{color:#b4a5b8;font-size:14px;line-height:1.9;max-width:480px}.scribble{position:absolute;right:9%;bottom:105px;color:#d1a6c6;font:italic 15px var(--serif);transform:rotate(-7deg)}.interests{padding-top:70px;padding-bottom:120px;border-top:1px solid var(--line)}.interestgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:45px}.interest{background:linear-gradient(155deg,rgba(39,28,47,.95),rgba(23,17,30,.95));border:1px solid var(--line);padding:19px 18px 22px}.itop{display:flex;justify-content:space-between;color:#c8a0ca;font:10px var(--mono)}.iart{height:140px;display:grid;place-items:center;position:relative}.ishape{width:92px;height:92px;border-radius:44% 56% 51% 49% /48% 41% 59% 52%;background:radial-gradient(circle at 35% 28%,rgba(205,147,192,.48),rgba(93,61,106,.2) 65%,transparent 66%);border:1px solid rgba(214,165,211,.3);box-shadow:0 0 0 13px rgba(214,165,211,.035),0 0 35px rgba(191,131,186,.12);transform:rotate(18deg)}.iicon{position:absolute;color:#e2b5d2;font-size:32px}.interest h3{font:500 21px var(--serif);margin:2px 0 9px}.interest p{color:#a99bab;font-size:11px;line-height:1.8;margin:0}.personalnote{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:37px 0;background:rgba(42,29,49,.48)}.personalnote p{font:italic 19px var(--serif);color:#c9b8cb;margin:0}

.personal-lead{max-width:650px!important;font-size:14px!important;line-height:1.95!important;color:#b9acbf!important}
.personal-block{padding:5px 0 68px}
.personal-heading{font:500 clamp(31px,3.5vw,43px)/1.15 var(--serif);letter-spacing:-.025em;margin:0 0 13px;color:#f0e5f1}
.personal-sub{color:#9f91a5;font-size:12px;line-height:1.8;margin:0 0 27px;max-width:640px}
.travel-panel{padding:27px 29px;border:1px solid var(--line);background:linear-gradient(125deg,rgba(65,43,69,.58),rgba(28,19,35,.78));position:relative;overflow:hidden}
.travel-count{display:flex;align-items:baseline;gap:13px;margin-bottom:17px}
.travel-count strong{font:500 52px var(--serif);color:#e5bdd5}
.travel-count span{font:10px var(--mono);letter-spacing:.15em;color:#c4a4c9}
.country-list{display:flex;flex-wrap:wrap;gap:8px}
.country-chip{padding:8px 11px;border:1px solid rgba(217,178,218,.22);background:rgba(15,10,20,.25);font-size:10px;color:#e0d2e4}
.story-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin-top:26px}
.story-card{padding:24px 24px 25px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(35,25,42,.96),rgba(22,16,28,.94))}
.story-label{font:9px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#c99fbd;margin-bottom:15px}
.story-card h3{font:500 24px var(--serif);margin:0 0 11px;color:#f0e5f1}
.story-card p{color:#afa1b3;font-size:11px;line-height:1.85;margin:0 0 13px}
.story-card p:last-child{margin-bottom:0}
.story-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.story-tags span{font:9px var(--mono);color:#d4b6d1;border:1px solid rgba(217,178,218,.18);padding:6px 8px}
.calligraphy{margin-top:16px;padding:13px 15px;border-left:2px solid #d6a4c1;background:rgba(213,164,193,.08);color:#e5cbdf;font-size:11px;line-height:1.7}
.movie-panel{display:flex;align-items:center;gap:21px;padding:24px 27px;border:1px solid var(--line);background:rgba(40,28,47,.6)}
.movie-mark{width:53px;height:53px;flex:0 0 53px;display:grid;place-items:center;border:1px solid rgba(214,165,211,.34);border-radius:50%;color:#e0b2d0;font-size:22px}
.movie-panel small{display:block;color:#c99fbd;font:9px var(--mono);letter-spacing:.15em;margin-bottom:7px}
.movie-panel strong{font:500 22px var(--serif);color:#f0e5f1}
.movie-panel p{color:#97899d;font-size:10px;margin:6px 0 0}
.personal-end{border-top:1px solid var(--line);padding:27px 0 55px;color:#bdaec1;font:italic 18px var(--serif)}
@media(max-width:640px){.story-grid{grid-template-columns:1fr}.travel-panel{padding:22px 18px}.movie-panel{padding:20px 18px}.personal-block{padding-bottom:48px}}


/* Personal profile — hobbies, language journey, routine and aspirations */
.personalhero{padding-bottom:72px}
.personal-sections{padding-bottom:112px}
.personal-intro-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:34px}
.personal-feature{min-height:205px;padding:25px 26px;background:linear-gradient(145deg,rgba(40,28,49,.94),rgba(23,17,30,.96));border:1px solid var(--line);position:relative;overflow:hidden}
.personal-feature:after{content:'';position:absolute;right:-35px;bottom:-80px;width:160px;height:160px;border:1px solid rgba(217,178,218,.12);border-radius:50%;box-shadow:0 0 0 18px rgba(217,178,218,.025),0 0 0 38px rgba(217,178,218,.018)}
.personal-feature .story-label{margin-bottom:17px}
.personal-feature h3{font:500 26px var(--serif);margin:0 0 10px;color:#f0e5f1;position:relative;z-index:1}
.personal-feature p{max-width:490px;color:#afa1b3;font-size:11px;line-height:1.9;margin:0;position:relative;z-index:1}
.personal-feature .story-tags{position:relative;z-index:1}
.language-layout{display:grid;grid-template-columns:.82fr 1.18fr;gap:35px;align-items:start;margin-top:35px}
.language-callout{padding:28px;border:1px solid rgba(217,178,218,.24);background:linear-gradient(145deg,rgba(74,48,78,.5),rgba(27,19,34,.85))}
.language-callout strong{display:block;font:500 48px var(--serif);color:#e3bbd6;margin-bottom:3px}
.language-callout span{font:9px var(--mono);letter-spacing:.16em;color:#c7a5ca}
.language-callout p{font-size:11px;line-height:1.85;color:#b9aaba;margin:18px 0 0}
.language-notes{border-top:1px solid var(--line)}
.language-note{padding:16px 0;border-bottom:1px solid var(--line)}
.language-note strong{display:block;color:#e7dce9;font-size:12px;margin-bottom:6px}
.language-note p{margin:0;color:#a99bab;font-size:11px;line-height:1.85}
.routine-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:36px}
.routine-item{padding:18px 14px 20px;border:1px solid var(--line);background:rgba(33,24,39,.76);min-height:127px}
.routine-time{color:#d7a6c4;font:10px var(--mono);letter-spacing:.04em;margin-bottom:13px}
.routine-item strong{display:block;color:#f0e5f1;font:500 16px var(--serif);margin-bottom:5px}
.routine-item p{font-size:10px;line-height:1.65;color:#9f91a5;margin:0}
.routine-note{color:#887b90;font:9px var(--mono);margin-top:14px}
.goals-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:35px}
.goal{padding:18px 16px;border:1px solid var(--line);background:linear-gradient(140deg,rgba(38,27,45,.96),rgba(22,16,28,.95));min-height:88px;display:flex;align-items:center;gap:11px}
.goal-no{color:#c99fbd;font:9px var(--mono)}
.goal span:last-child{color:#e5d9e7;font-size:11px;line-height:1.5}
.personal-closing{padding:30px 0 55px;border-top:1px solid var(--line);color:#cdbbcf;font:italic 20px var(--serif)}
@media(max-width:900px){.language-layout{grid-template-columns:1fr;gap:18px}.routine-grid{grid-template-columns:repeat(3,1fr)}.goals-grid{grid-template-columns:repeat(2,1fr)}}

  cursor:pointer;
  transition:border-color .25s,transform .25s,background .25s;

.life-trigger{display:block;width:100%;padding:0;border:0;background:transparent;color:inherit;text-align:left;cursor:pointer}
.life-photo{height:clamp(165px,19vw,225px);overflow:hidden;position:relative;background:#1b1422}
.life-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .75s cubic-bezier(.2,.7,.2,1),filter .6s}

.life-content{padding:17px 18px 20px}

@keyframes revealText{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.inline-detail{padding:14px 16px 17px;border-top:1px solid rgba(220,184,226,.12);color:#b9acbf;font-size:11px;line-height:1.85;background:rgba(11,8,15,.22);animation:revealText .25s ease both}
.interest-photo{cursor:pointer;transition:border-color .25s,transform .25s}
.interest-photo:hover{border-color:rgba(219,181,222,.5);transform:translateY(-3px)}
.interest-photo .interest-copy h3{font-size:clamp(19px,2vw,25px)}
.interest-photo .interest-copy p{display:none}
.interest-photo .interest-copy small{display:none}
.interest-photo .interest-copy .mini-tags,.interest-photo .travel-stat{display:none}
.interest-photo button{cursor:pointer}
.cat-grid{align-items:stretch}
.cat-gallery-item{min-width:0}
.cat-photo{width:100%;display:block;height:190px;border:1px solid rgba(219,181,222,.16);background:#21172a;padding:0;cursor:pointer;overflow:hidden;position:relative}
.cat-photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s}
.cat-photo:hover img{transform:scale(1.05)}
.cat-photo:after{content:'';position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(13,9,18,.7));pointer-events:none}
.cat-photo span{position:absolute;z-index:2;bottom:11px;left:12px;color:white;font:9px var(--mono);letter-spacing:.08em}
.cat-gallery-item.is-open .cat-photo{border-color:#d7a6c9}
.language-list{border-top:1px solid var(--line)}
.language-entry{border-bottom:1px solid var(--line)}
.language-button{width:100%;display:grid;grid-template-columns:95px 1fr 22px;gap:15px;align-items:center;padding:17px 0;border:0;background:transparent;color:inherit;text-align:left;cursor:pointer}

.language-button span{font:10px var(--mono);color:#9c8fa2}
.language-button i{font-style:normal;color:#d4a5c8;transition:transform .2s}
.language-button[aria-expanded="true"] i{transform:rotate(45deg)}
.plan-entry{border-bottom:1px solid rgba(223,193,227,.15)}
.plan-row{border-bottom:0}

.plan-detail{padding:0 18px 14px 102px;color:#b9acbf;font-size:10px;line-height:1.8;animation:revealText .25s ease both}

.story-dialog-backdrop{position:fixed;inset:0;z-index:120;background:rgba(6,4,10,.78);backdrop-filter:blur(9px);display:grid;place-items:center;padding:22px;animation:detailFade .18s ease}
.story-dialog{width:min(700px,100%);max-height:88vh;overflow:auto;position:relative;padding:34px;background:linear-gradient(145deg,#24192c,#120d19);border:1px solid rgba(220,184,226,.28);box-shadow:0 24px 90px #0009}
.story-dialog-close{position:absolute;right:19px;top:17px;width:36px;height:36px;border-radius:50%;border:1px solid rgba(230,205,232,.25);background:rgba(255,255,255,.07);color:#fff;font-size:22px;cursor:pointer}

.story-dialog-language{padding:13px 0;border-bottom:1px solid var(--line)}

.story-dialog-language span{display:block;color:#ad9eb2;font-size:11px;line-height:1.8}
.story-dialog-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:27px}

.story-dialog-progress{color:#9f8fa5;font:9px var(--mono);letter-spacing:.1em}
.day-section-head{margin-bottom:28px}
.day-clock{border:1px solid rgba(190,163,215,.25);background:#171321;overflow:hidden}
.day-sky{height:300px;position:relative;overflow:hidden;transition:background 1.1s ease}

.day-horizon{position:absolute;left:-5%;right:-5%;height:75px;bottom:-43px;border-radius:50% 50% 0 0/60% 60% 0 0;background:rgba(18,22,30,.42);z-index:2}
.day-sun,.day-moon{position:absolute;width:48px;height:48px;border-radius:50%;transform:translate(-50%,-50%);transition:left .7s linear,top .7s linear,opacity .7s ease;z-index:1}
.day-sun{background:radial-gradient(circle at 35% 30%,#fff4ca,#ffc16e 66%,#ed895e);box-shadow:0 0 28px 9px rgba(255,197,122,.35),0 0 85px 20px rgba(255,181,117,.18)}
.day-moon{background:radial-gradient(circle at 38% 35%,#fff,#d6dff8 70%);box-shadow:0 0 25px 7px rgba(221,230,255,.23)}

.day-stars.active{opacity:.9;animation:starsTwinkle 4s ease-in-out infinite alternate}

.day-sky-label{position:absolute;left:24px;top:21px;z-index:3;color:#fff;font:9px var(--mono);letter-spacing:.18em;text-transform:uppercase;text-shadow:0 1px 8px #0005}

.day-controls{display:flex;gap:8px;flex-wrap:wrap}

.day-controls button.primary-day{background:#d3a4c4;color:#211526;border-color:#d3a4c4}
.day-timeline{padding:19px 24px 22px;background:#18121f}
.day-progress{height:4px;background:rgba(224,200,228,.13);position:relative;margin:7px 0 15px}
.day-progress-fill{height:100%;background:linear-gradient(90deg,#bd92c7,#e8b5a6);transition:width .55s linear}
.day-hours{display:flex;justify-content:space-between;color:#93849a;font:8px var(--mono)}
.day-events{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px}
.day-event{padding:11px 10px;border:1px solid rgba(221,190,226,.12);background:rgba(255,255,255,.025);min-width:0}
.day-event.active{border-color:rgba(227,181,211,.56);background:rgba(189,146,199,.13)}
.day-event time{display:block;color:#d4a4c5;font:9px var(--mono);margin-bottom:6px}
.day-event strong{display:block;color:#e9deea;font:500 13px var(--serif)}
.day-speed{color:#85768d;font:8px var(--mono);margin-top:12px}
@media(max-width:720px){.story-dialog{padding:25px 20px}.day-sky{height:230px}.day-readout{grid-template-columns:1fr;gap:16px;padding:19px}.day-events{grid-template-columns:repeat(2,1fr)}.day-event:last-child{grid-column:span 2}}
