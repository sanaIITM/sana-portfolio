padding:5px 8px;font:9px var(--mono)}.plink{display:flex;gap:17px;margin-top:auto;padding-top:18px}.plink a{color:#e0b6d0;font-size:10px}.plink a:after{content:' ↗'}.subtle{background:radial-gradient(ellipse at 50% 60%,rgba(187,109,143,.24),transparent 65%),linear-gradient(135deg,rgba(78,42,65,.4),rgba(29,22,38,.18))}

footer{border-top:1px solid var(--line);background:#0d0912}.foot{min-height:86px;display:flex;align-items:center;justify-content:space-between;gap:20px}.footmark{width:30px;height:30px;font-size:20px}.foot p{color:#827687;font-size:10px;margin-right:auto;margin-left:10px}.footlinks{display:flex;align-items:center;gap:20px}.footlinks button,.footlinks a{font-size:10px}.footyear{color:#685c70;font:9px var(--mono)}
.personalhero{padding-top:115px;padding-bottom:95px;position:relative}.personalhero h1{font-size:clamp(60px,7vw,88px)}.personalhero>p{color:#b4a5b8;font-size:14px;line-height:1.9;max-width:480px}.scribble{position:absolute;right:9%;bottom:105px;color:#d1a6c6;font:italic 15px var(--serif);transform:rotate(-7deg)}.interests{padding-top:70px;padding-bottom:120px;border-top:1px solid var(--line)}.interestgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:45px}.interest{background:linear-gradient(155deg,rgba(39,28,47,.95),rgba(23,17,30,.95));border:1px solid var(--line);padding:19px 18px 22px}.itop{display:flex;justify-content:space-between;color:#c8a0ca;font:10px var(--mono)}.iart{height:140px;display:grid;place-items:center;position:relative}.ishape{width:92px;height:92px;border-radius:44% 56% 51% 49% /48% 41% 59% 52%;background:radial-gradient(circle at 35% 28%,rgba(205,147,192,.48),rgba(93,61,106,.2) 65%,transparent 66%);border:1px solid rgba(214,165,211,.3);box-shadow:0 0 0 13px rgba(214,165,211,.035),0 0 35px rgba(191,131,186,.12);transform:rotate(18deg)}.iicon{position:absolute;color:#e2b5d2;font-size:32px}.interest h3{font:500 21px var(--serif);margin:2px 0 9px}.interest p{color:#a99bab;font-size:11px;line-height:1.8;margin:0}.personalnote{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:37px 0;background:rgba(42,29,49,.48)}.personalnote p{font:italic 19px var(--serif);color:#c9b8cb;margin:0}

.personal-lead{max-width:650px!important;font-size:14px!important;line-height:1.95!important;color:#b9acbf!important}
.personal-block{padding:5px 0 68px}
.personal-heading{font:500 clamp(31px,3.5vw,43px)/1.15 var(--serif);letter-spacing:-.025em;margin:0 0 13px;color:#f0e5f1}
.personal-sub{color:#9f91a5;font-size:12px;line-height:1.8;margin:0 0 27px;max-width:640px}
.travel-panel{padding:27px 29px;border:1px solid var(--line);background:linear-gradient(125deg,rgba(65,43,69,.58),rgba(28,19,35,.78));position:relative;overflow:hidden}
.travel-count{display:flex;align-items:baseline;gap:13px;margin-bottom:17px}
.travel-count strong{font:500 52px var(--serif);color:#e5bdd5}
.travel-count span{font:10px var(--mono);letter-spacing:.15em;color:#c4a4c9}
.country-list{display:flex;flex-wrap:wrap;gap:8px}
.country-chip{padding:8px 11px;border:1px solid rgba(217,178,218,.22);background:rgba(15,10,20,.25);font-size:10px;color:#e0d2e4}
.story-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin-top:26px}
.story-card{padding:24px 24px 25px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(35,25,42,.96),rgba(22,16,28,.94))}
.story-label{font:9px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#c99fbd;margin-bottom:15px}
.story-card h3{font:500 24px var(--serif);margin:0 0 11px;color:#f0e5f1}
.story-card p{color:#afa1b3;font-size:11px;line-height:1.85;margin:0 0 13px}
.story-card p:last-child{margin-bottom:0}
.story-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.story-tags span{font:9px var(--mono);color:#d4b6d1;border:1px solid rgba(217,178,218,.18);padding:6px 8px}
.calligraphy{margin-top:16px;padding:13px 15px;border-left:2px solid #d6a4c1;background:rgba(213,164,193,.08);color:#e5cbdf;font-size:11px;line-height:1.7}
.movie-panel{display:flex;align-items:center;gap:21px;padding:24px 27px;border:1px solid var(--line);background:rgba(40,28,47,.6)}
.movie-mark{width:53px;height:53px;flex:0 0 53px;display:grid;place-items:center;border:1px solid rgba(214,165,211,.34);border-radius:50%;color:#e0b2d0;font-size:22px}
.movie-panel small{display:block;color:#c99fbd;font:9px var(--mono);letter-spacing:.15em;margin-bottom:7px}
.movie-panel strong{font:500 22px var(--serif);color:#f0e5f1}
.movie-panel p{color:#97899d;font-size:10px;margin:6px 0 0}
.personal-end{border-top:1px solid var(--line);padding:27px 0 55px;color:#bdaec1;font:italic 18px var(--serif)}
@media(max-width:640px){.story-grid{grid-template-columns:1fr}.travel-panel{padding:22px 18px}.movie-panel{padding:20px 18px}.personal-block{padding-bottom:48px}}


/* Personal profile — hobbies, language journey, routine and aspirations */
.personalhero{padding-bottom:72px}
.personal-sections{padding-bottom:112px}
.personal-intro-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:34px}
.personal-feature{min-height:205px;padding:25px 26px;background:linear-gradient(145deg,rgba(40,28,49,.94),rgba(23,17,30,.96));border:1px solid var(--line);position:relative;overflow:hidden}
.personal-feature:after{content:'';position:absolute;right:-35px;bottom:-80px;width:160px;height:160px;border:1px solid rgba(217,178,218,.12);border-radius:50%;box-shadow:0 0 0 18px rgba(217,178,218,.025),0 0 0 38px rgba(217,178,218,.018)}
.personal-feature .story-label{margin-bottom:17px}
.personal-feature h3{font:500 26px var(--serif);margin:0 0 10px;color:#f0e5f1;position:relative;z-index:1}
.personal-feature p{max-width:490px;color:#afa1b3;font-size:11px;line-height:1.9;margin:0;position:relative;z-index:1}
.personal-feature .story-tags{position:relative;z-index:1}
.language-layout{display:grid;grid-template-columns:.82fr 1.18fr;gap:35px;align-items:start;margin-top:35px}
.language-callout{padding:28px;border:1px solid rgba(217,178,218,.24);background:linear-gradient(145deg,rgba(74,48,78,.5),rgba(27,19,34,.85))}
.language-callout strong{display:block;font:500 48px var(--serif);color:#e3bbd6;margin-bottom:3px}
.language-callout span{font:9px var(--mono);letter-spacing:.16em;color:#c7a5ca}
.language-callout p{font-size:11px;line-height:1.85;color:#b9aaba;margin:18px 0 0}
.language-notes{border-top:1px solid var(--line)}
.language-note{padding:16px 0;border-bottom:1px solid var(--line)}
.language-note strong{display:block;color:#e7dce9;font-size:12px;margin-bottom:6px}
.language-note p{margin:0;color:#a99bab;font-size:11px;line-height:1.85}
.routine-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:36px}
.routine-item{padding:18px 14px 20px;border:1px solid var(--line);background:rgba(33,24,39,.76);min-height:127px}
.routine-time{color:#d7a6c4;font:10px var(--mono);letter-spacing:.04em;margin-bottom:13px}
.routine-item strong{display:block;color:#f0e5f1;font:500 16px var(--serif);margin-bottom:5px}
.routine-item p{font-size:10px;line-height:1.65;color:#9f91a5;margin:0}
.routine-note{color:#887b90;font:9px var(--mono);margin-top:14px}
.goals-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:35px}
.goal{padding:18px 16px;border:1px solid var(--line);background:linear-gradient(140deg,rgba(38,27,45,.96),rgba(22,16,28,.95));min-height:88px;display:flex;align-items:center;gap:11px}
.goal-no{color:#c99fbd;font:9px var(--mono)}
.goal span:last-child{color:#e5d9e7;font-size:11px;line-height:1.5}
.personal-closing{padding:30px 0 55px;border-top:1px solid var(--line);color:#cdbbcf;font:italic 20px var(--serif)}
@media(max-width:900px){.language-layout{grid-template-columns:1fr;gap:18px}.routine-grid{grid-template-columns:repeat(3,1fr)}.goals-grid{grid-template-columns:repeat(2,1fr)}}

/* Full-screen water-ripple transition — 1.2 seconds */
.page-ripple{
 position:fixed;
 inset:0;
 z-index:9999;
 pointer-events:none;
 overflow:hidden;
 isolation:isolate;
}
.page-ripple:before{
 content:'';
 position:absolute;
 inset:-8%;
 background:
  radial-gradient(ellipse at 50% 46%,rgba(246,219,239,.96) 0%,rgba(211,169,215,.97) 17%,rgba(130,108,163,.98) 43%,rgba(43,34,65,.99) 72%,#130e1b 100%);
 clip-path:circle(0% at 50% 50%);
 animation:waterVeil 1.2s cubic-bezier(.65,0,.25,1) both;
}
.page-ripple:after{
 content:'';
 position:absolute;
 left:50%;
 top:50%;
 width:34vmin;
 height:34vmin;
 border:1px solid rgba(255,246,255,.72);
 border-radius:50%;
 transform:translate(-50%,-50%) scale(.12);
 opacity:0;
 box-shadow:
  0 0 0 18px rgba(231,202,236,.18),
  0 0 0 42px rgba(194,173,222,.12),
  0 0 0 70px rgba(160,177,210,.08),
  0 0 38px rgba(255,234,255,.34);
 animation:waterRings 1.2s cubic-bezier(.18,.72,.22,1) both;
}
@keyframes waterVeil{
 0%{clip-path:circle(0% at 50% 50%);opacity:0}
 9%{opacity:1}
 43%{clip-path:circle(155% at 50% 50%);opacity:1}
 58%{clip-path:circle(155% at 50% 50%);opacity:1}
 100%{clip-path:circle(0% at 50% 50%);opacity:0}
}
@keyframes waterRings{
 0%{transform:translate(-50%,-50%) scale(.12);opacity:0}
 13%{opacity:.9}
 48%{transform:translate(-50%,-50%) scale(4.8);opacity:.62}
 70%{transform:translate(-50%,-50%) scale(5.4);opacity:.28}
 100%{transform:translate(-50%,-50%) scale(6);opacity:0}
}

.garden-footnote{position:absolute;bottom:13px;left:0;right:0;text-align:center;color:#b4c0a9;font:italic 13px var(--serif);letter-spacing:.04em}
.garden-fireflies{position:fixed;inset:0;pointer-events:none;z-index:1}
.cat-discovery{position:fixed;z-index:5;right:clamp(14px,4vw,55px);bottom:clamp(14px,4vh,38px);width:min(320px,calc(100vw - 28px));padding:12px;background:linear-gradient(145deg,#34253a,#1d3027);border:1px solid rgba(227,199,160,.56);border-radius:16px;box-shadow:0 22px 55px rgba(0,0,0,.52);animation:discoveryPop .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes discoveryPop{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
.cat-discovery-photo{width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:9px;border:1px solid rgba(239,214,174,.28);background:rgba(20,36,27,.5);box-shadow:inset 0 0 32px rgba(0,0,0,.1)}
.cat-discovery-photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
.cat-discovery-caption{padding:13px 6px 5px}
.cat-discovery-caption small{font:8px var(--mono);letter-spacing:.18em;color:#e1c18f}
.cat-discovery-caption h3{font:500 23px var(--serif);color:#f6e9dc;margin:5px 0}
.cat-discovery-caption p{font-size:10px;line-height:1.6;color:#c3c7b7;margin:0}
.discovery-close{position:absolute;top:18px;right:18px;z-index:2;background:rgba(13,24,19,.82)}
.garden-footer{text-align:center;margin:18px auto 0;color:#809787;font:8px var(--mono);letter-spacing:.2em}
@media(max-width:700px){
 .cat-keepsake-section{padding-top:65px;padding-bottom:70px}.cat-keepsake{height:220px}.keepsake-front{height:132px}.keepsake-lid{height:82px}.keepsake-vine{font-size:29px}
 .cat-garden-screen{padding:18px 12px 28px}.garden-header h2{font-size:29px}.garden-invitation{font-size:12px;margin-bottom:14px}
 .garden-world{min-height:66vh;border-radius:14px}.garden-maze{inset:7% 1% 9%;height:84%}.garden-egg{width:34px;height:34px}
 .garden-footnote{font-size:11px;padding:0 12px}.cat-discovery{width:min(270px,calc(100vw - 28px));right:14px;bottom:14px}
}
@media(prefers-reduced-motion:reduce){.cat-garden-screen,.garden-fireflies i,.garden-egg-glow,.cat-discovery{animation:none!important}}

@media(prefers-reduced-motion:reduce){
 .page-ripple:before,.page-ripple:after{animation-duration:.01ms;opacity:0}
}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important}.personal-marquee-track{animation:none}.reveal{opacity:1;transform:none}}

/* Personal hero: centred introduction, no floating photo collage */
.personalhero-new{display:flex!important;justify-content:center;align-items:center;min-height:clamp(430px,62vh,620px);padding-top:84px;padding-bottom:84px}
.personalhero-new .personal-hero-copy{width:min(800px,100%);margin:0 auto;text-align:center;display:flex;flex-direction:column;align-items:center}
.personalhero-new .personal-hero-copy .personal-lead{max-width:690px!important;margin-left:auto;margin-right:auto}
.personalhero-new h1{margin-left:auto;margin-right:auto}
@media(max-width:640px){.personalhero-new{min-height:390px;padding-top:62px;padding-bottom:62px}.personalhero-new .personal-hero-copy{width:100%}.personalhero-new h1{font-size:clamp(46px,12vw,64px)}}

.contact-socials{display:flex;align-items:center;gap:23px;margin-top:36px;position:relative;z-index:2}
.contact-social-icon{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;color:#d9b5d2;text-decoration:none;opacity:.9;transition:transform .22s ease,color .22s ease,opacity .22s ease,filter .22s ease}
.contact-social-icon svg{display:block;width:25px;height:25px}
.contact-social-icon:hover{color:#fff;opacity:1;transform:translateY(-4px) scale(1.12);filter:drop-shadow(0 0 8px rgba(223,177,216,.45))}
.contact-social-icon:focus-visible{outline:1px solid #e7c5df;outline-offset:6px;border-radius:3px}

function DaySimulation(){
const [minute,setMinute]=React.useState(240);
const [playing,setPlaying]=React.useState(false);
React.useEffect(()=>{
 if(!playing)return;
 const timer=setInterval(()=>setMinute(current=>{if(current>=1410){setPlaying(false);return 0}return current+30}),625);
 return()=>clearInterval(timer);
},[playing]);
const hour=Math.floor(minute/60),mins=minute%60;
const time=String(hour).padStart(2,'0')+':'+String(mins).padStart(2,'0');
const progress=minute/1440*100;
const night=hour>=20||hour<5;
const sunProgress=Math.max(0,Math.min(1,(minute/60-5)/14));
const sunLeft=(5+sunProgress*90)+'%';

const moonLeft=(7+Math.max(0,Math.min(1,moonProgress))*86)+'%';

let active=-1;

function App(){
const[page,setPage]=useState('professional');
const[transitioning,setTransitioning]=useState(false);
const[story,setStory]=useState(null);
const showStory=(title,kicker,body,nextIndex=null)=>setStory({title,kicker,body,nextIndex});
const closeStory=()=>{
 const next=story?.nextIndex;
 setStory(null);
 if(next!==null&&next!==undefined){
  setTimeout(()=>{
   const target=document.getElementById('life-card-'+((next+1)%lifeChapters.length));
   if(target)target.scrollIntoView({behavior:'smooth',block:'nearest',inline:'start'});
  },180);
 }
};
const switchPage=target=>{
 if(target===page||transitioning)return;
 setTransitioning(true);
 window.setTimeout(()=>{setPage(target);window.scrollTo({top:0,behavior:'instant'})},600);
 window.setTimeout(()=>setTransitioning(false),1200);
};
React.useEffect(()=>{
 if(page!=='personal')return;
 const nodes=document.querySelectorAll('.reveal');
 const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{
  if(entry.isIntersecting){entry.target.classList.add('is-visible');observer.unobserve(entry.target)}
 }),{threshold:.12});
 nodes.forEach(node=>observer.observe(node));
 return()=>observer.disconnect();
},[page]);
return h(React.Fragment,null,
 h(Header,{page,setPage:switchPage}),
 page==='professional'?h(Professional,{setPage:switchPage}):h('main',null,h(Personal,{onOpenStory:showStory})),
 h(Footer,{page,setPage:switchPage}),
 h(StoryDialog,{story,onClose:closeStory}),
 transitioning?h('div',{className:'page-ripple','aria-hidden':true}):null
);
}
createRoot(document.getElementById('root')).render(h(React.StrictMode,null,h(App)));
